name: 每日分析定时器

on:
  schedule:
    - cron: '30 7 * * 1-5'   # 工作日 15:30 北京时间（UTC 07:30）
  workflow_dispatch:

permissions:
  actions: write

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch daily analysis
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 只在 15:20–16:20（北京时间）窗口内真正触发，避免 GitHub 延迟投递时半夜发报告
          NOW=$(TZ=Asia/Shanghai date +%H%M)
          echo "当前北京时间: $NOW"
          if [ "$NOW" -lt 1520 ] || [ "$NOW" -gt 1620 ]; then
            echo "不在 15:20–16:20 窗口内，跳过"
            exit 0
          fi
          echo "触发每日分析…"
          gh workflow run daily-analysis.yml --repo "${{ github.repository }}" -f mode=full